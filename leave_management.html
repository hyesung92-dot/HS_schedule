<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>육아기 단축근무자 휴가 관리표</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 980px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .summary-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: white;
            border-radius: 6px;
            padding: 10px 12px;
            border-left: 4px solid #adb5bd;
        }
        .summary-card.gw { border-left-color: #0d6efd; }
        .summary-card.sw { border-left-color: #dc3545; }
        .summary-card.oral { border-left-color: #fd7e14; }
        .summary-label {
            display: block;
            font-size: 0.8em;
            color: #6c757d;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
        }
        .summary-value {
            display: block;
            font-size: 1.25em;
            font-weight: bold;
            color: #212529;
            line-height: 1.3;
        }
        .summary-card.gw .summary-value { color: #0d6efd; }
        .summary-card.sw .summary-value { color: #dc3545; }
        .summary-card.oral .summary-value { color: #fd7e14; }
        .summary-value.over { color: #dc3545 !important; }
        .summary-sub {
            display: block;
            font-size: 0.72em;
            color: #868e96;
            margin-top: 4px;
            line-height: 1.4;
        }
        .cell-sub {
            display: block;
            font-size: 0.75em;
            color: #868e96;
            margin-top: 2px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        align-items: flex-end;
            flex-wrap: wrap;
        }
    select, input, button {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        input[readonly] {
            background-color: #e9ecef;
            color: #666;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            cursor: pointer;
            padding: 8px 15px;
        }
        button:hover {
            background-color: #0b5ed7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        table-layout: fixed;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: center;
        word-wrap: break-word;
        }
        th {
            background-color: #f8f9fa;
        }
        .sort-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 4px;
            font-size: 0.85em;
            color: #0d6efd;
            vertical-align: middle;
        }
        .sort-btn:hover {
            background: none;
            color: #0b5ed7;
        }
        .btn-delete {
            background-color: #dc3545;
            padding: 4px 8px;
            font-size: 0.9em;
        }
        .btn-delete:hover {
            background-color: #bb2d3b;
        }
        .btn-edit {
            background-color: #ffc107;
            color: black;
            padding: 4px 8px;
            font-size: 0.9em;
        }
        .btn-edit:hover {
            background-color: #e0a800;
        }
    </style>
    <!-- SheetJS (엑셀 다운로드용 라이브러리) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
    <h2>육아기 단축근무자 휴가 관리표</h2>
    
    <!-- 요약 정보 -->
    <div class="summary-box">
        <div class="summary-card">
            <span class="summary-label">총 부여 연차</span>
            <span class="summary-value" id="totalDays">20일</span>
            <span class="summary-sub">그룹웨어 <span id="gwTotalHours">160</span>시간 / 단축근무 <span id="swTotalHours">120</span>시간</span>
        </div>
        <div class="summary-card gw">
            <span class="summary-label">잔여연차 (그룹웨어)</span>
            <span class="summary-value" id="remainGw">20일 (160시간)</span>
            <span class="summary-sub">전자결재 Y만 · 연차 8h / 반차 4h<br>사용 <span id="usedGw">0</span>시간 (<span id="usedGwDays">0</span>일)</span>
        </div>
        <div class="summary-card sw">
            <span class="summary-label">잔여연차 (단축근무)</span>
            <span class="summary-value" id="remainSw">26.67일 (160시간)</span>
            <span class="summary-sub">연차 <span id="remainSwLeave">120</span>시간 + 구두보고 <span id="remainSwOral">40</span>시간<br>Y + N 전체 · 사용 <span id="usedSw">0</span>시간 (<span id="usedSwDays">0</span>일)</span>
        </div>
        <div class="summary-card oral">
            <span class="summary-label">쓸 수 있는 구두보고</span>
            <span class="summary-value" id="oralRemain">6.67개 (40시간)</span>
            <span class="summary-sub">연초 부여 <span id="oralTotalUnits">6.67</span>개 (<span id="oralTotalHours">40</span>시간) · 1개 = 6시간<br>사용 <span id="oralUsedHours">0</span>시간 (<span id="oralUsedCount">0</span>건)</span>
        </div>
    </div>

    <!-- 휴가 입력 폼 -->
    <form id="leaveForm" class="form-group">
        <!-- 날짜부터 전자결재여부까지 한 줄로 유지되도록 묶음 -->
        <div style="display: flex; gap: 10px; flex-wrap: nowrap; flex: 0 1 auto;">
            <div style="display: flex; flex-direction: column; gap: 5px; width: 120px; flex-shrink: 1;">
                <label for="leaveDate" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">휴가날짜</label>
                <input type="date" id="leaveDate" required style="width: 100%; box-sizing: border-box;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 5px; width: 95px; flex-shrink: 1;">
                <label for="leaveType" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">휴가 구분</label>
                <select id="leaveType" required style="width: 100%; box-sizing: border-box;">
                    <option value="">선택</option>
                    <option value="연차">연차</option>
                    <option value="오전 반차">오전 반차</option>
                    <option value="오후 반차">오후 반차</option>
                    <option value="그외">그 외</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px; width: 75px; flex-shrink: 0;">
                <label for="leaveHours" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">사용시간</label>
                <input type="number" id="leaveHours" placeholder="시간" style="width: 100%; box-sizing: border-box;" required readonly>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px; width: 95px; flex-shrink: 0;">
                <label for="approvalType" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">전자결재여부</label>
                <input type="text" id="approvalType" placeholder="결재" style="width: 100%; box-sizing: border-box;" required readonly>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px;">
            <label for="leaveRemarks" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">비고(메모)</label>
            <input type="text" id="leaveRemarks" placeholder="내용 입력" style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="display: flex; gap: 5px; flex-shrink: 0;">
            <button type="submit" id="submitBtn">등록</button>
            <button type="button" id="cancelEditBtn" style="display: none; background-color: #6c757d; color: white;">취소</button>
        </div>
    </form>

    <!-- 휴가 사용 내역 테이블 -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 5px;">
        <button type="button" onclick="downloadExcel()" style="background-color: #198754; color: white; border-radius: 4px;">엑셀 다운로드</button>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 6%;">No.</th>
                <th style="width: 14%; white-space: nowrap;">휴가사용일 <button class="sort-btn" id="sortDateBtn" onclick="toggleSort()" title="날짜 정렬">▼</button></th>
                <th style="width: 11%;">휴가구분</th>
                <th style="width: 14%;">휴가사용시간</th>
                <th style="width: 15%;">전자결재여부</th>
                <th style="width: 30%;">비고</th>
                <th style="width: 10%;">관리</th>
            </tr>
        </thead>
        <tbody id="leaveTableBody">
            <!-- 데이터가 여기에 추가됩니다 -->
        </tbody>
    </table>
</div>

<script>
    // 기본 설정값
    // 회사에서 부여받은 연차는 20일. 단, 1일을 몇 시간으로 환산하느냐가 두 가지로 갈린다.
    //  - 그룹웨어 기준: 통상근로 1일 = 8시간 (연차 8h / 반차 4h), 전자결재 Y 건만 차감
    //  - 단축근무 기준: 단축근로 1일 = 6시간 (연차 6h / 반차 3h), 결재 Y/N 전부 차감
    const TOTAL_DAYS = 20;
    const GW_HOURS_PER_DAY = 8;
    const SW_HOURS_PER_DAY = 6;
    const GW_TOTAL_HOURS = TOTAL_DAYS * GW_HOURS_PER_DAY; // 160
    const SW_TOTAL_HOURS = TOTAL_DAYS * SW_HOURS_PER_DAY; // 120
    // 연차 1개는 그룹웨어 8h 중 6h만 실제로 쓰므로 나머지 2h가 구두보고 몫이다.
    // 그 몫을 연초에 통째로(20일 x 2h = 40시간) 부여받고, 구두보고 건을 쓸 때마다 차감한다.
    // 개수는 단축근무 1일(6시간)을 1개로 환산해서 센다.
    const ORAL_TOTAL_HOURS = GW_TOTAL_HOURS - SW_TOTAL_HOURS;          // 40시간
    const ORAL_UNIT_HOURS = SW_HOURS_PER_DAY;                          // 1개 = 6시간
    const ORAL_TOTAL_UNITS = ORAL_TOTAL_HOURS / ORAL_UNIT_HOURS;       // 6.67개
    const HALF_TYPES = ['오전 반차', '오후 반차'];

    let leaveData = [];
    let editingId = null; // 수정 중인 휴가 ID 보관
    let sortOrder = 'desc'; // 'asc' | 'desc'

    // DOM 요소 선택
    const leaveForm = document.getElementById('leaveForm');
    const leaveType = document.getElementById('leaveType');
    const leaveDate = document.getElementById('leaveDate');
    const leaveHours = document.getElementById('leaveHours');
    const approvalType = document.getElementById('approvalType');
    const leaveRemarks = document.getElementById('leaveRemarks');
    const leaveTableBody = document.getElementById('leaveTableBody');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const totalDaysEl = document.getElementById('totalDays');
    const gwTotalHoursEl = document.getElementById('gwTotalHours');
    const swTotalHoursEl = document.getElementById('swTotalHours');
    const remainGwEl = document.getElementById('remainGw');
    const usedGwEl = document.getElementById('usedGw');
    const usedGwDaysEl = document.getElementById('usedGwDays');
    const remainSwEl = document.getElementById('remainSw');
    const remainSwLeaveEl = document.getElementById('remainSwLeave');
    const remainSwOralEl = document.getElementById('remainSwOral');
    const usedSwEl = document.getElementById('usedSw');
    const usedSwDaysEl = document.getElementById('usedSwDays');
    const oralRemainEl = document.getElementById('oralRemain');
    const oralTotalUnitsEl = document.getElementById('oralTotalUnits');
    const oralTotalHoursEl = document.getElementById('oralTotalHours');
    const oralUsedHoursEl = document.getElementById('oralUsedHours');
    const oralUsedCountEl = document.getElementById('oralUsedCount');

    // 초기 데이터 불러오기
    document.addEventListener('DOMContentLoaded', fetchLeaves);

    async function fetchLeaves() {
        const response = await fetch('/api/leaves');
        leaveData = await response.json();
        updateUI();
    }

    // 휴가 구분 변경 시 자동 매핑 로직
    leaveType.addEventListener('change', function() {
        const type = this.value;
        if (type === '연차') {
            leaveHours.value = 6;
            leaveHours.readOnly = true;
            approvalType.value = '대상 (Y)';
            approvalType.readOnly = true;
        } else if (type === '오전 반차' || type === '오후 반차') {
            leaveHours.value = 3;
            leaveHours.readOnly = true;
            approvalType.value = '대상 (Y)';
            approvalType.readOnly = true;
        } else if (type === '그외') {
            leaveHours.value = ''; // 사용자가 직접 입력하도록 비움
            leaveHours.readOnly = false;
            leaveHours.focus();
            approvalType.value = '비대상 (N - 구두보고)';
            approvalType.readOnly = true;
        } else {
            leaveHours.value = '';
            approvalType.value = '';
            leaveHours.readOnly = true;
        }
    });

    // 폼 제출(등록) 처리
    leaveForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const leavePayload = {
            date: leaveDate.value,
            type: leaveType.value,
            hours: parseInt(leaveHours.value, 10),
            approval: approvalType.value,
            remarks: leaveRemarks.value
        };

        try {
            if (editingId) {
                // 기존 내역 수정 (PUT)
                const response = await fetch(`/api/leaves/${editingId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leavePayload)
                });
                if (response.ok) {
                    cancelEdit(); // 폼 초기화 및 수정 모드 종료
                    await fetchLeaves(); // 최신 데이터 다시 불러오기
                }
            } else {
                // 신규 등록 (POST)
                const response = await fetch('/api/leaves', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leavePayload)
                });
                if (response.ok) {
                    leaveForm.reset();
                    leaveHours.readOnly = true;
                    await fetchLeaves();
                }
            }
        } catch (error) {
            console.error('저장 중 오류 발생:', error);
        }
    });

    // 내역 수정 모드로 폼에 데이터 채우기
    function editLeave(id) {
        const leave = leaveData.find(item => item._id === id);
        if (!leave) return;

        editingId = id;
        leaveDate.value = leave.date;
        leaveType.value = leave.type;
        leaveHours.value = leave.hours;
        approvalType.value = leave.approval;
        leaveRemarks.value = leave.remarks;

        // '그외' 항목일 경우 사용시간 입력 가능하도록 풀기
        leaveHours.readOnly = (leave.type !== '그외');

        // 버튼 디자인 변경
        submitBtn.textContent = '수정';
        submitBtn.style.backgroundColor = '#ffc107';
        submitBtn.style.color = 'black';
        cancelEditBtn.style.display = 'inline-block';
    }

    // 수정 취소 (폼 초기화)
    function cancelEdit() {
        editingId = null;
        leaveForm.reset();
        leaveHours.readOnly = true;
        submitBtn.textContent = '등록';
        submitBtn.style.backgroundColor = '#0d6efd';
        submitBtn.style.color = 'white';
        cancelEditBtn.style.display = 'none';
    }

    // 취소 버튼 이벤트 연결
    cancelEditBtn.addEventListener('click', cancelEdit);

    // 내역 삭제
    async function deleteLeave(id) {
        try {
            const response = await fetch(`/api/leaves/${id}`, { method: 'DELETE' });
            if (response.ok) {
                await fetchLeaves(); // DB 삭제 후 최신 데이터 재조회
            }
        } catch (error) {
            console.error('삭제 중 오류 발생:', error);
        }
    }

    // XSS 방어를 위한 HTML 특수문자 이스케이프 함수
    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, function(tag) {
            const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
            return charsToReplace[tag] || tag;
        });
    }

    // 날짜 정렬 토글
    function toggleSort() {
        sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        const btn = document.getElementById('sortDateBtn');
        btn.textContent = sortOrder === 'asc' ? '▲' : '▼';
        updateUI();
    }

    // 날짜 기준 정렬된 사본 반환
    function getSortedData() {
        return [...leaveData].sort((a, b) => {
            if (a.date < b.date) return sortOrder === 'asc' ? -1 : 1;
            if (a.date > b.date) return sortOrder === 'asc' ? 1 : -1;
            return 0;
        });
    }

    // 전자결재 대상(Y) 여부 판정
    // '비대상'에도 '대상'이 포함되므로 문자열 포함 검사 대신 (Y)/(N 패턴으로 판단한다.
    function isEApproved(item) {
        const approval = String(item.approval || '');
        if (/\(\s*Y/.test(approval)) return true;
        if (/\(\s*N/.test(approval)) return false;
        // 결재여부가 비어있는 예전 데이터는 휴가구분으로 판단
        return item.type === '연차' || HALF_TYPES.includes(item.type);
    }

    // 그룹웨어 기준 차감 시간 (연차 8h / 반차 4h, 결재 비대상(N)은 차감 없음)
    function getGwHours(item) {
        if (!isEApproved(item)) return 0;
        if (item.type === '연차') return GW_HOURS_PER_DAY;
        if (HALF_TYPES.includes(item.type)) return GW_HOURS_PER_DAY / 2;
        return Number(item.hours) || 0;
    }

    // 단축근무 기준 차감 시간 (연차 6h / 반차 3h, 그 외는 입력한 시간 그대로)
    function getSwHours(item) {
        if (item.type === '연차') return SW_HOURS_PER_DAY;
        if (HALF_TYPES.includes(item.type)) return SW_HOURS_PER_DAY / 2;
        return Number(item.hours) || 0;
    }

    // 소수점 뒤 불필요한 0을 떼고 표시 (18 → '18', 18.5 → '18.5', 0.333 → '0.33')
    function fmtNum(num) {
        return String(Number(num.toFixed(2)));
    }

    // 잔여 일수/시간 표기 + 초과 여부 반영
    function setRemainText(el, remainHours, hoursPerDay) {
        el.textContent = `${fmtNum(remainHours / hoursPerDay)}일 (${fmtNum(remainHours)}시간)`;
        el.classList.toggle('over', remainHours < 0);
    }

    // UI 업데이트 (테이블 및 잔여시간 계산)
    function updateUI() {
        const sorted = getSortedData();

        // 테이블 초기화
        leaveTableBody.innerHTML = '';
        let usedGw = 0;         // 그룹웨어 기준 사용 시간 (전자결재 Y만)
        let usedSw = 0;         // 단축근무 기준 사용 시간 (Y + N 전체)
        let oralUsedHours = 0;  // 구두보고(N)로 실제 쓴 시간
        let oralUsedCount = 0;

        // 데이터 렌더링
        sorted.forEach((item, index) => {
            const gwHours = getGwHours(item);
            const swHours = getSwHours(item);
            usedGw += gwHours;
            usedSw += swHours;

            if (!isEApproved(item)) {
                oralUsedHours += swHours;
                oralUsedCount++;
            }

            const gwCellSub = gwHours > 0
                ? `결재 ${fmtNum(gwHours)}시간`
                : '결재 비대상';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.date}</td>
                <td>${item.type}</td>
                <td>${fmtNum(swHours)}시간<span class="cell-sub">${gwCellSub}</span></td>
                <td>${item.approval}</td>
                <td style="text-align: left;">${escapeHTML(item.remarks)}</td>
                <td>
                    <button class="btn-edit" onclick="editLeave('${item._id}')">수정</button>
                    <button class="btn-delete" onclick="deleteLeave('${item._id}')">삭제</button>
                </td>
            `;
            leaveTableBody.appendChild(tr);
        });

        // 요약 정보 업데이트
        totalDaysEl.textContent = `${TOTAL_DAYS}일`;
        gwTotalHoursEl.textContent = GW_TOTAL_HOURS;
        swTotalHoursEl.textContent = SW_TOTAL_HOURS;

        usedGwEl.textContent = fmtNum(usedGw);
        usedGwDaysEl.textContent = fmtNum(usedGw / GW_HOURS_PER_DAY);
        setRemainText(remainGwEl, GW_TOTAL_HOURS - usedGw, GW_HOURS_PER_DAY);

        // 단축근무 잔여 = 연차분(120h에서 Y건 차감) + 구두보고분(40h에서 N건 차감)
        const oralRemainHours = ORAL_TOTAL_HOURS - oralUsedHours;
        const swLeaveRemainHours = SW_TOTAL_HOURS - (usedSw - oralUsedHours);

        usedSwEl.textContent = fmtNum(usedSw);
        usedSwDaysEl.textContent = fmtNum(usedSw / SW_HOURS_PER_DAY);
        remainSwLeaveEl.textContent = fmtNum(swLeaveRemainHours);
        remainSwOralEl.textContent = fmtNum(oralRemainHours);
        setRemainText(remainSwEl, swLeaveRemainHours + oralRemainHours, SW_HOURS_PER_DAY);

        oralRemainEl.textContent = `${fmtNum(oralRemainHours / ORAL_UNIT_HOURS)}개 (${fmtNum(oralRemainHours)}시간)`;
        oralRemainEl.classList.toggle('over', oralRemainHours < 0);
        oralTotalUnitsEl.textContent = fmtNum(ORAL_TOTAL_UNITS);
        oralTotalHoursEl.textContent = fmtNum(ORAL_TOTAL_HOURS);
        oralUsedHoursEl.textContent = fmtNum(oralUsedHours);
        oralUsedCountEl.textContent = oralUsedCount;
    }

    // 엑셀 다운로드 기능
    function downloadExcel() {
        // 1. 엑셀에 들어갈 데이터 배열 생성 (첫 줄은 표의 헤더)
        const excelData = [
            ['No.', '휴가사용일', '휴가구분', '사용시간(단축근무)', '사용시간(그룹웨어)', '전자결재여부', '비고']
        ];

        // 2. 화면과 같은 정렬 순서로 순회하며 엑셀 행 데이터에 추가
        const sorted = getSortedData();
        let usedGw = 0;
        let usedSw = 0;
        let oralUsedHours = 0;
        sorted.forEach((item, index) => {
            const gwHours = getGwHours(item);
            const swHours = getSwHours(item);
            usedGw += gwHours;
            usedSw += swHours;
            if (!isEApproved(item)) {
                oralUsedHours += swHours;
            }
            excelData.push([index + 1, item.date, item.type, swHours, gwHours, item.approval, item.remarks || '']);
        });

        // 3. 합계 및 잔여 요약 행 추가
        excelData.push([]);
        excelData.push(['', '사용 합계', '', usedSw, usedGw, '', '']);
        excelData.push([
            '', '잔여(그룹웨어)', `${fmtNum((GW_TOTAL_HOURS - usedGw) / GW_HOURS_PER_DAY)}일`,
            '', GW_TOTAL_HOURS - usedGw, '전자결재 Y만 / 연차 8h·반차 4h', ''
        ]);
        const oralRemainHours = ORAL_TOTAL_HOURS - oralUsedHours;
        const swLeaveRemainHours = SW_TOTAL_HOURS - (usedSw - oralUsedHours);
        const swRemainHours = swLeaveRemainHours + oralRemainHours;
        excelData.push([
            '', '잔여(단축근무)', `${fmtNum(swRemainHours / SW_HOURS_PER_DAY)}일`,
            swRemainHours, '', `연차 ${fmtNum(swLeaveRemainHours)}시간 + 구두보고 ${fmtNum(oralRemainHours)}시간`, ''
        ]);
        excelData.push([
            '', '쓸 수 있는 구두보고', `${fmtNum(oralRemainHours / ORAL_UNIT_HOURS)}개`,
            oralRemainHours, '', `연초 부여 ${fmtNum(ORAL_TOTAL_HOURS)}시간 - 사용 ${fmtNum(oralUsedHours)}시간 (1개 = ${ORAL_UNIT_HOURS}시간)`, ''
        ]);

        // 4. 가상의 엑셀 워크시트와 워크북 생성
        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "휴가내역");

        // 5. 엑셀 파일 다운로드 실행
        XLSX.writeFile(workbook, "휴가사용내역.xlsx");
    }
</script>
