<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>육아기 단축근무자 휴가 관리표</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .summary-box {
            display: flex;
            justify-content: space-between;
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .summary-box div {
            color: #0d6efd;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        align-items: flex-end;
            flex-wrap: wrap;
        }
    select, input, button {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        input[readonly] {
            background-color: #e9ecef;
            color: #666;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            cursor: pointer;
            padding: 8px 15px;
        }
        button:hover {
            background-color: #0b5ed7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        table-layout: fixed;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: center;
        word-wrap: break-word;
        }
        th {
            background-color: #f8f9fa;
        }
        .sort-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 4px;
            font-size: 0.85em;
            color: #0d6efd;
            vertical-align: middle;
        }
        .sort-btn:hover {
            background: none;
            color: #0b5ed7;
        }
        .btn-delete {
            background-color: #dc3545;
            padding: 4px 8px;
            font-size: 0.9em;
        }
        .btn-delete:hover {
            background-color: #bb2d3b;
        }
        .btn-edit {
            background-color: #ffc107;
            color: black;
            padding: 4px 8px;
            font-size: 0.9em;
        }
        .btn-edit:hover {
            background-color: #e0a800;
        }
    </style>
    <!-- SheetJS (엑셀 다운로드용 라이브러리) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
    <h2>육아기 단축근무자 휴가 관리표</h2>
    
    <!-- 요약 정보 -->
    <div class="summary-box">
        <div>총 휴가: 20일 (160시간)</div>
        <div>사용한 휴가: <span id="usedHours">0</span>시간</div>
        <div style="color: #dc3545;">잔여 휴가: <span id="remainHours">20일 (160시간)</span></div>
    </div>

    <!-- 휴가 입력 폼 -->
    <form id="leaveForm" class="form-group">
        <!-- 날짜부터 전자결재여부까지 한 줄로 유지되도록 묶음 -->
        <div style="display: flex; gap: 10px; flex-wrap: nowrap; flex: 0 1 auto;">
            <div style="display: flex; flex-direction: column; gap: 5px; width: 120px; flex-shrink: 1;">
                <label for="leaveDate" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">휴가날짜</label>
                <input type="date" id="leaveDate" required style="width: 100%; box-sizing: border-box;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 5px; width: 95px; flex-shrink: 1;">
                <label for="leaveType" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">휴가 구분</label>
                <select id="leaveType" required style="width: 100%; box-sizing: border-box;">
                    <option value="">선택</option>
                    <option value="연차">연차</option>
                    <option value="오전 반차">오전 반차</option>
                    <option value="오후 반차">오후 반차</option>
                    <option value="그외">그 외</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px; width: 75px; flex-shrink: 0;">
                <label for="leaveHours" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">사용시간</label>
                <input type="number" id="leaveHours" placeholder="시간" style="width: 100%; box-sizing: border-box;" required readonly>
            </div>

            <div style="display: flex; flex-direction: column; gap: 5px; width: 95px; flex-shrink: 0;">
                <label for="approvalType" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">전자결재여부</label>
                <input type="text" id="approvalType" placeholder="결재" style="width: 100%; box-sizing: border-box;" required readonly>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px;">
            <label for="leaveRemarks" style="font-size: 0.85em; color: #555; font-weight: bold; white-space: nowrap;">비고(메모)</label>
            <input type="text" id="leaveRemarks" placeholder="내용 입력" style="width: 100%; box-sizing: border-box;">
        </div>
        <div style="display: flex; gap: 5px; flex-shrink: 0;">
            <button type="submit" id="submitBtn">등록</button>
            <button type="button" id="cancelEditBtn" style="display: none; background-color: #6c757d; color: white;">취소</button>
        </div>
    </form>

    <!-- 휴가 사용 내역 테이블 -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 5px;">
        <button type="button" onclick="downloadExcel()" style="background-color: #198754; color: white; border-radius: 4px;">엑셀 다운로드</button>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 15%; white-space: nowrap;">휴가사용일 <button class="sort-btn" id="sortDateBtn" onclick="toggleSort()" title="날짜 정렬">▼</button></th>
                <th style="width: 12%;">휴가구분</th>
                <th style="width: 15%;">휴가사용시간</th>
                <th style="width: 15%;">전자결재여부</th>
                <th style="width: 33%; text-align: left;">비고</th>
                <th style="width: 10%;">관리</th>
            </tr>
        </thead>
        <tbody id="leaveTableBody">
            <!-- 데이터가 여기에 추가됩니다 -->
        </tbody>
    </table>
</div>

<script>
    // 기본 설정값 (연차 20개 * 8시간 = 160시간)
    const TOTAL_HOURS = 160;
    let leaveData = [];
    let editingId = null; // 수정 중인 휴가 ID 보관
    let sortOrder = 'desc'; // 'asc' | 'desc'

    // DOM 요소 선택
    const leaveForm = document.getElementById('leaveForm');
    const leaveType = document.getElementById('leaveType');
    const leaveDate = document.getElementById('leaveDate');
    const leaveHours = document.getElementById('leaveHours');
    const approvalType = document.getElementById('approvalType');
    const leaveRemarks = document.getElementById('leaveRemarks');
    const leaveTableBody = document.getElementById('leaveTableBody');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const usedHoursEl = document.getElementById('usedHours');
    const remainHoursEl = document.getElementById('remainHours');

    // 초기 데이터 불러오기
    document.addEventListener('DOMContentLoaded', fetchLeaves);

    async function fetchLeaves() {
        const response = await fetch('/api/leaves');
        leaveData = await response.json();
        updateUI();
    }

    // 휴가 구분 변경 시 자동 매핑 로직
    leaveType.addEventListener('change', function() {
        const type = this.value;
        if (type === '연차') {
            leaveHours.value = 6;
            leaveHours.readOnly = true;
            approvalType.value = '대상 (Y)';
            approvalType.readOnly = true;
        } else if (type === '오전 반차' || type === '오후 반차') {
            leaveHours.value = 3;
            leaveHours.readOnly = true;
            approvalType.value = '대상 (Y)';
            approvalType.readOnly = true;
        } else if (type === '그외') {
            leaveHours.value = ''; // 사용자가 직접 입력하도록 비움
            leaveHours.readOnly = false;
            leaveHours.focus();
            approvalType.value = '비대상 (N - 구두보고)';
            approvalType.readOnly = true;
        } else {
            leaveHours.value = '';
            approvalType.value = '';
            leaveHours.readOnly = true;
        }
    });

    // 폼 제출(등록) 처리
    leaveForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const leavePayload = {
            date: leaveDate.value,
            type: leaveType.value,
            hours: parseInt(leaveHours.value, 10),
            approval: approvalType.value,
            remarks: leaveRemarks.value
        };

        try {
            if (editingId) {
                // 기존 내역 수정 (PUT)
                const response = await fetch(`/api/leaves/${editingId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leavePayload)
                });
                if (response.ok) {
                    cancelEdit(); // 폼 초기화 및 수정 모드 종료
                    await fetchLeaves(); // 최신 데이터 다시 불러오기
                }
            } else {
                // 신규 등록 (POST)
                const response = await fetch('/api/leaves', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leavePayload)
                });
                if (response.ok) {
                    leaveForm.reset();
                    leaveHours.readOnly = true;
                    await fetchLeaves();
                }
            }
        } catch (error) {
            console.error('저장 중 오류 발생:', error);
        }
    });

    // 내역 수정 모드로 폼에 데이터 채우기
    function editLeave(id) {
        const leave = leaveData.find(item => item._id === id);
        if (!leave) return;

        editingId = id;
        leaveDate.value = leave.date;
        leaveType.value = leave.type;
        leaveHours.value = leave.hours;
        approvalType.value = leave.approval;
        leaveRemarks.value = leave.remarks;

        // '그외' 항목일 경우 사용시간 입력 가능하도록 풀기
        leaveHours.readOnly = (leave.type !== '그외');

        // 버튼 디자인 변경
        submitBtn.textContent = '수정';
        submitBtn.style.backgroundColor = '#ffc107';
        submitBtn.style.color = 'black';
        cancelEditBtn.style.display = 'inline-block';
    }

    // 수정 취소 (폼 초기화)
    function cancelEdit() {
        editingId = null;
        leaveForm.reset();
        leaveHours.readOnly = true;
        submitBtn.textContent = '등록';
        submitBtn.style.backgroundColor = '#0d6efd';
        submitBtn.style.color = 'white';
        cancelEditBtn.style.display = 'none';
    }

    // 취소 버튼 이벤트 연결
    cancelEditBtn.addEventListener('click', cancelEdit);

    // 내역 삭제
    async function deleteLeave(id) {
        try {
            const response = await fetch(`/api/leaves/${id}`, { method: 'DELETE' });
            if (response.ok) {
                await fetchLeaves(); // DB 삭제 후 최신 데이터 재조회
            }
        } catch (error) {
            console.error('삭제 중 오류 발생:', error);
        }
    }

    // XSS 방어를 위한 HTML 특수문자 이스케이프 함수
    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, function(tag) {
            const charsToReplace = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
            return charsToReplace[tag] || tag;
        });
    }

    // 날짜 정렬 토글
    function toggleSort() {
        sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        const btn = document.getElementById('sortDateBtn');
        btn.textContent = sortOrder === 'asc' ? '▲' : '▼';
        updateUI();
    }

    // UI 업데이트 (테이블 및 잔여시간 계산)
    function updateUI() {
        // 날짜 정렬
        const sorted = [...leaveData].sort((a, b) => {
            if (a.date < b.date) return sortOrder === 'asc' ? -1 : 1;
            if (a.date > b.date) return sortOrder === 'asc' ? 1 : -1;
            return 0;
        });

        // 테이블 초기화
        leaveTableBody.innerHTML = '';
        let totalUsed = 0;

        // 데이터 렌더링
        sorted.forEach(item => {
            totalUsed += item.hours;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.date}</td>
                <td>${item.type}</td>
                <td>${item.hours}시간</td>
                <td>${item.approval}</td>
                <td style="text-align: left;">${escapeHTML(item.remarks)}</td>
                <td>
                    <button class="btn-edit" onclick="editLeave('${item._id}')">수정</button>
                    <button class="btn-delete" onclick="deleteLeave('${item._id}')">삭제</button>
                </td>
            `;
            leaveTableBody.appendChild(tr);
        });

        // 요약 정보 업데이트
        usedHoursEl.textContent = totalUsed;
        const remainHours = TOTAL_HOURS - totalUsed;
        const remainDays = remainHours / 8;
        remainHoursEl.textContent = `${remainDays}일 (${remainHours}시간)`;
    }

    // 엑셀 다운로드 기능
    function downloadExcel() {
        // 1. 엑셀에 들어갈 데이터 배열 생성 (첫 줄은 표의 헤더)
        const excelData = [
            ['휴가사용일', '휴가구분', '휴가사용시간(시간)', '전자결재여부', '비고']
        ];

        // 2. 현재 화면에 있는 데이터(leaveData)를 순회하며 엑셀 행 데이터에 추가
        leaveData.forEach(item => {
            excelData.push([item.date, item.type, item.hours, item.approval, item.remarks || '']);
        });

        // 3. 가상의 엑셀 워크시트와 워크북 생성
        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "휴가내역");

        // 4. 엑셀 파일 다운로드 실행
        XLSX.writeFile(workbook, "휴가사용내역.xlsx");
    }
</script>

</body>
</html>
